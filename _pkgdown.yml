url: https://alexandercoppock.com/estimatrTools/

template:
  bootstrap: 5
  theme: gruvbox-light
  includes:
    in_header: |
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
  bslib:
    primary: '#a72f5b'
    body-bg: '#FBFAF7'
    body-color: '#3C444C'
    link-color: '#a72f5b'
    link-hover-color: '#7d2244'
    border-color: '#E4E0D8'
    muted-color: '#6B7078'
    rule-color: '#E4E0D8'
    rule-strong: '#D6D1C6'
    accent-teal: '#004c6d'
    code-bg: '#F3EFE7'
    border-radius: '2px'
    btn-border-radius: '2px'
    font-size-base: '1.0625rem'
    line-height-base: '1.6'
    font-family-sans-serif: '"Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif'
    headings-font-family: '"Source Serif 4", Georgia, "Times New Roman", serif'
    font-family-monospace: '"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace'
    headings-font-weight: '600'
    code-color: '#004c6d'
reference:
- title: Selecting covariates
  desc: >
    Post-double-selection LASSO: the outcome within each treatment arm, and
    each arm indicator on the candidates.
  contents:
  - lasso_select_covariates
  - lasso_select_one

- title: Adjusted estimators
  desc: >
    Fit the selected set. Each falls back to a simpler specification when
    selection returns nothing or the adjusted fit is degenerate.
  contents:
  - lm_lin_lasso
  - lm_robust_lasso
  - lm_moderator_lasso

- title: Bootstrap
  desc: >
    Refit on resampled rows when the spread across replicates is the standard
    error you want.
  contents:
  - lm_bootstrap
  - tidy.lm_bootstrap

- title: Attrition
  desc: >
    Whether treatment predicts who is missing, allowing the pattern to differ
    across covariates.
  contents:
  - check_attrition_lasso

- title: What actually ran
  desc: >
    A fallback changes what the estimate is, so it is recorded rather than
    hidden. Which accessor you need depends on whether you still hold the fit.
  contents:
  - adjustment
  - fallback_summary
  - fallback_log

- title: Package
  contents:
  - estimatrTools-package

articles:
- title: Articles
  navbar: ~
  contents:
  - covariate_selection
